name: Fan Standard APK and Play Bundle

on:
  workflow_dispatch:
  push:
    paths:
      - 'Fan_Standard_Android_Project/**'
      - '.github/workflows/fan-standard.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_UPLOAD_KEY: ${{ secrets.FAN_UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare upload signing key
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.FAN_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fan-upload-key.jks"
          test -s "$RUNNER_TEMP/fan-upload-key.jks"

      - name: Build debug APK and release app bundle
        working-directory: Fan_Standard_Android_Project
        env:
          FAN_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/fan-upload-key.jks
          FAN_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.FAN_UPLOAD_KEYSTORE_PASSWORD }}
          FAN_UPLOAD_KEY_ALIAS: ${{ secrets.FAN_UPLOAD_KEY_ALIAS }}
          FAN_UPLOAD_KEY_PASSWORD: ${{ secrets.FAN_UPLOAD_KEY_PASSWORD }}
        run: gradle assembleDebug bundleRelease --stacktrace

      - name: Verify release bundle signing when upload key is configured
        if: ${{ secrets.FAN_UPLOAD_KEYSTORE_BASE64 != '' }}
        working-directory: Fan_Standard_Android_Project
        run: |
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab
          echo "Release AAB signature verification completed."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Fan-Standard-Android-Build
          path: |
            Fan_Standard_Android_Project/app/build/outputs/apk/debug/*.apk
            Fan_Standard_Android_Project/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
