name: Fan Standard APK Build
on:
  workflow_dispatch:
  push:
    paths:
      - 'Fan_Standard_Android_Project/**'
      - '.github/workflows/fan-standard.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: Fan_Standard_Android_Project
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Fan-Standard-APK
          path: Fan_Standard_Android_Project/app/build/outputs/apk/debug/*.apk
