name: Build QC Standard APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'QC_Standard_Android_Project.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Project
        run: unzip -o QC_Standard_Android_Project.zip -d extracted

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: extracted/QC_Standard_Android_Project
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QC-Standard-APK
          path: extracted/QC_Standard_Android_Project/app/build/outputs/apk/debug/*.apk
