name: Deploy Fan Standard Web App

on:
  push:
    branches: [main]
    paths:
      - 'Fan_Standard_Android_Project/app/src/main/assets/www/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: Fan_Standard_Android_Project/app/src/main/assets/www
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
